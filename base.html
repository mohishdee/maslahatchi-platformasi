<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maslahatchi Platformasi</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head><body>
<header class="top"><div class="brand">🎓 <span>Maslahatchi</span></div>
{% if session.get('user_id') %}<nav><a href="{{url_for('dashboard')}}">Bosh sahifa</a><a href="{{url_for('students')}}">O‘quvchilar</a><a class="logout" href="{{url_for('logout')}}">Chiqish</a></nav>{% endif %}

<main class="wrap">

{% block content %}{% endblock %}
</main>
<footer>© Maslahatchi Platformasi</footer>
</body></html>
